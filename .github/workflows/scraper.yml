name: TDXFlix Auto Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for better pull
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Run TDXFlix Scraper
      run: |
        python tdxflix_scraper.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add the file
        git add tdxflix.json
        
        # Check if there are changes to commit
        if ! git diff --quiet HEAD -- tdxflix.json; then
          git commit -m "Auto-update tdxflix.json [$(date +'%Y-%m-%d %H:%M:%S')]"
          
          # Pull latest changes first (with rebase to avoid merge commits)
          git pull --rebase origin main
          
          # Push the changes
          git push origin main
          
          echo "✅ Changes pushed successfully"
        else
          echo "ℹ️ No changes to commit"
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdxflix-data
        path: tdxflix.json
        retention-days: 7
        if-no-files-found: warn
