name: TDXFlix Auto Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # NO CACHE PARAMETERS AT ALL
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Run TDXFlix Scraper
      run: |
        python tdxflix_scraper.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add tdxflix.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update tdxflix.json" && git push)
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdxflix-data
        path: tdxflix.json
        retention-days: 7
