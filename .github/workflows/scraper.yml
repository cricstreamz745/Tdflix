name: TDXFlix Auto Scraper

on:
  schedule:
    # Runs every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Run TDXFlix Scraper
      run: |
        python tdxflix_scraper.py
        
    - name: Check and commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if file exists and has changes
        if [ -f "tdxflix.json" ]; then
          git add tdxflix.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update tdxflix.json [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push
        else
          echo "tdxflix.json not found!"
          exit 1
        fi
        
    - name: Upload artifact (optional)
      uses: actions/upload-artifact@v3
      with:
        name: tdxflix-data
        path: tdxflix.json
